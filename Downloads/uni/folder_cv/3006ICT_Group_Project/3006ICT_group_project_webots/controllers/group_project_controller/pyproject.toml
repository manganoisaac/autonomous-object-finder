[project]
name = "group-project-controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Isaac Mangano", email = "manganoisaac@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
group-project-controller = "group_project_controller:main"

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
